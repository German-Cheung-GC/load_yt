<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Loading YouTube</title>
  <style>
    :root { color-scheme: dark; }

    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #app {
      position: relative;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      z-index: 2;
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #status {
      top: 16px;
      left: 16px;
      padding: 8px 12px;
      color: #fff;
      background: rgb(0 0 0 / 65%);
      border-radius: 6px;
    }

  </style>
</head>
<body>
  <main id="app">
    <div id="status">Loading YouTube…</div>
    <div id="player"></div>
  </main>

  <script>
    (() => {
      const query = new URLSearchParams(window.location.search);
      const status = document.getElementById('status');

      // The page-level parameter is mute=0 by default. YouTube's embed
      // parameter also uses numeric values: mute=0 enables sound and mute=1
      // silences playback.
      const muteValue = query.get('mute') || '0';
      const muted = /^(1|true|yes|on)$/i.test(muteValue);

      function parseYouTubeUrl(value) {
        const source = new URL(value, window.location.href);
        const host = source.hostname.toLowerCase();
        const isYouTube = host === 'youtu.be'
          || host === 'www.youtu.be'
          || host === 'youtube.com'
          || host === 'www.youtube.com'
          || host === 'm.youtube.com';

        if (!isYouTube) {
          throw new Error('The url parameter must be a YouTube URL.');
        }

        let videoId = '';
        if (host === 'youtu.be' || host === 'www.youtu.be') {
          videoId = source.pathname.split('/').filter(Boolean)[0] || '';
        } else if (source.pathname === '/watch') {
          videoId = source.searchParams.get('v') || '';
        } else {
          const parts = source.pathname.split('/').filter(Boolean);
          if (parts[0] === 'embed' || parts[0] === 'shorts' || parts[0] === 'live') {
            videoId = parts[1] || '';
          }
        }

        if (!/^[\w-]{6,}$/.test(videoId)) {
          throw new Error('The url parameter does not contain a valid YouTube video ID.');
        }

        return {
          videoId,
          playlist: source.searchParams.get('list') || ''
        };
      }

      function loadYouTubeApi() {
        if (window.YT?.Player) return Promise.resolve();

        return new Promise((resolve, reject) => {
          window.onYouTubeIframeAPIReady = resolve;
          const script = document.createElement('script');
          script.src = 'https://www.youtube.com/iframe_api';
          script.onerror = () => reject(new Error('Unable to load the YouTube player API.'));
          document.head.appendChild(script);
        });
      }

      async function launchYouTubePlayer() {
        const requestedUrl = query.get('url');
        if (!requestedUrl) {
          throw new Error('Missing required url parameter.');
        }

        const { videoId, playlist } = parseYouTubeUrl(requestedUrl);
        await loadYouTubeApi();

        const playerVars = {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          mute: muted ? 1 : 0,
          playsinline: 1,
          rel: 0
        };
        if (playlist) {
          playerVars.list = playlist;
          playerVars.listType = 'playlist';
        }

        new YT.Player('player', {
          videoId,
          playerVars,
          events: {
            onReady: (event) => {
              const iframe = document.querySelector('#player iframe');
              if (iframe) {
                iframe.allow = 'autoplay; fullscreen; picture-in-picture';
                iframe.allowFullscreen = true;
              }

              status.hidden = true;
              event.target.playVideo();

              if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {
                  // Browser fullscreen normally requires a user gesture.
                });
              }
            },
            onError: (event) => {
              status.hidden = false;
              status.textContent = `YouTube player error (${event.data}).`;
            }
          }
        });
      }

      launchYouTubePlayer().catch((error) => {
        status.textContent = error.message;
      });
    })();
  </script>
</body>
</html>
