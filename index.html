<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="build-timestamp-utc" content="2026-08-31T16:13:03Z">
  <title>Loading ...</title>
  <style>
    :root { color-scheme: dark; }

    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #app {
      position: relative;
    }

    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #status {
      position: fixed;
      z-index: 2;
      pointer-events: none;
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #status {
      top: 16px;
      left: 16px;
      padding: 8px 12px;
      color: #fff;
      background: rgb(0 0 0 / 65%);
      border-radius: 6px;
    }

  </style>
</head>
<body>
  <main id="app">
    <div id="status">Loading ...</div>
    <div id="player"></div>
  </main>

  <script>
    (() => {
      const query = new URLSearchParams(window.location.search);
      const status = document.getElementById('status');
      const START_DELAY_MS = 5000;

      // The page-level parameter is mute=0 by default. YouTube's embed
      // parameter also uses numeric values: mute=0 enables sound and mute=1
      // silences playback.
      const muteValue = query.get('mute') || '0';
      const muted = /^(1|true|yes|on)$/i.test(muteValue);
      const loopValue = query.get('loop') || '0';
      const loopEnabled = /^(1|true|yes|on)$/i.test(loopValue);
      const interactValue = query.get('interact') || '0';
      const interactive = /^(1|true|yes|on)$/i.test(interactValue);

      function parseYouTubeUrl(value) {
        const source = new URL(value, window.location.href);
        const host = source.hostname.toLowerCase();
        const isYouTube = host === 'youtu.be'
          || host === 'www.youtu.be'
          || host === 'youtube.com'
          || host === 'www.youtube.com'
          || host === 'm.youtube.com';

        if (!isYouTube) {
          throw new Error('The url parameter must be a YouTube URL.');
        }

        let videoId = '';
        if (host === 'youtu.be' || host === 'www.youtu.be') {
          videoId = source.pathname.split('/').filter(Boolean)[0] || '';
        } else if (source.pathname === '/watch') {
          videoId = source.searchParams.get('v') || '';
        } else {
          const parts = source.pathname.split('/').filter(Boolean);
          if (parts[0] === 'embed' || parts[0] === 'shorts' || parts[0] === 'live') {
            videoId = parts[1] || '';
          }
        }

        if (!/^[\w-]{6,}$/.test(videoId)) {
          throw new Error('The url parameter does not contain a valid YouTube video ID.');
        }

        return {
          videoId,
          playlist: source.searchParams.get('list') || ''
        };
      }

      function loadYouTubeApi() {
        if (window.YT?.Player) return Promise.resolve();

        return new Promise((resolve, reject) => {
          window.onYouTubeIframeAPIReady = resolve;
          const script = document.createElement('script');
          script.src = 'https://www.youtube.com/iframe_api';
          script.onerror = () => reject(new Error('Unable to load the YouTube player API.'));
          document.head.appendChild(script);
        });
      }

      function getBufferText(player) {
        const fraction = player.getVideoLoadedFraction();
        const duration = player.getDuration();
        const percent = Math.round(fraction * 100);

        if (duration > 0) {
          const bufferedSeconds = Math.round(fraction * duration);
          return `buffer ${percent}% (${bufferedSeconds}s/${Math.round(duration)}s)`;
        }
        return `buffer ${percent}%`;
      }

      function getStateText(state) {
        return {
          [-1]: 'Unstarted',
          0: 'Ended',
          1: 'Playing',
          2: 'Paused',
          3: 'Buffering',
          5: 'Cued'
        }[state] || 'Loading';
      }

      async function launchYouTubePlayer() {
        const requestedUrl = query.get('url');
        if (!requestedUrl) {
          throw new Error('Missing required url parameter.');
        }

        const { videoId, playlist } = parseYouTubeUrl(requestedUrl);
        await loadYouTubeApi();

        const playerElement = document.getElementById('player');
        playerElement.style.pointerEvents = interactive ? 'auto' : 'none';

        const playerVars = {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          loop: loopEnabled ? 1 : 0,
          mute: muted ? 1 : 0,
          playsinline: 1,
          rel: 0
        };
        if (playlist) {
          playerVars.list = playlist;
          playerVars.listType = 'playlist';
        }

        new YT.Player('player', {
          videoId,
          playerVars,
          events: {
            onReady: (event) => {
              const player = event.target;
              const iframe = document.querySelector('#player iframe');
              if (iframe) {
                iframe.allow = 'autoplay; fullscreen; picture-in-picture';
                iframe.allowFullscreen = true;
              }

              const updateStatus = (label) => {
                status.textContent = `${label} · ${getBufferText(player)}`;
                status.hidden = false;
              };

              updateStatus('Player ready; starting in 5s');
              window.setInterval(() => {
                updateStatus(getStateText(player.getPlayerState()));
              }, 500);

              status.hidden = false;
              window.setTimeout(() => {
                updateStatus('Play requested');
                player.playVideo();
              }, START_DELAY_MS);

              if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {
                  // Browser fullscreen normally requires a user gesture.
                });
              }
            },
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.ENDED && loopEnabled && !playlist) {
                status.textContent = `Replaying · ${getBufferText(event.target)}`;
                status.hidden = false;
                event.target.seekTo(0, true);
                event.target.playVideo();
                return;
              }

              status.textContent = `${getStateText(event.data)} · ${getBufferText(event.target)}`;
              status.hidden = false;
            },
            onError: (event) => {
              status.hidden = false;
              status.textContent = `YouTube player error (${event.data}).`;
            }
          }
        });
      }

      launchYouTubePlayer().catch((error) => {
        status.textContent = error.message;
      });
    })();
  </script>
</body>
</html>
